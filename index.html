<title>Comparador de Preços</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: painel de dados escuro — barra fixa no topo, conteúdo numa coluna de até 1100px,
   tabela de lojas vira cartões no celular. Visual escuro de propósito (pedido dela). */
:root {
  color-scheme: dark;
  --bg: #070b14;          /* fundo, azul quase preto */
  --panel: #0e1524;       /* painéis */
  --panel-2: #131d31;     /* painel em destaque / hover */
  --line: #1f2b44;        /* bordas e grade */
  --fg: #e6edf7;          /* texto */
  --muted: #8796b0;       /* texto secundário */
  --neon: #2ee6ff;        /* destaque principal (ciano) */
  --neon-dim: rgba(46, 230, 255, .14);
  --good: #5cf2a0;        /* bom: menor preço */
  --good-dim: rgba(92, 242, 160, .13);
  --warn: #ffb347;        /* atenção: caro */
  --warn-dim: rgba(255, 179, 71, .14);
  --pink: #ff5cc8;        /* imposto */
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", Consolas, "Courier New", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { overflow-x: clip; }
body {
  background: var(--bg);
  background-image: radial-gradient(1200px 500px at 85% -10%, rgba(46,230,255,.08), transparent 60%),
                    linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: auto, 48px 48px, 48px 48px;
  background-attachment: fixed;
  color: var(--fg);
  font: 15px/1.55 var(--font-body);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--neon); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* ---------- topo ---------- */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(7,11,20,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topo-in, .demo-in, main { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topo-in { display: flex; align-items: center; gap: 16px; padding-block: 12px; }
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); font: 700 20px/1 var(--font-display); letter-spacing: .02em; }
.marca-icone { width: 30px; height: 30px; border: 1.5px solid var(--neon); border-radius: 7px; display: grid; place-items: center; box-shadow: 0 0 14px rgba(46,230,255,.35); }
.marca-icone svg { width: 18px; height: 18px; }
.topo nav { margin-left: auto; display: flex; gap: 6px; }
.topo nav a { text-decoration: none; color: var(--muted); padding: 7px 12px; border-radius: 8px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.topo nav a:hover, .topo nav a.ativo { color: var(--fg); background: var(--panel-2); }
.contador { background: var(--neon); color: var(--bg); font: 600 11px/1 var(--font-data); padding: 3px 6px; border-radius: 99px; }
.contador[data-zero] { display: none; }
.demo { background: var(--warn-dim); border-bottom: 1px solid rgba(255,179,71,.3); color: var(--warn); font-size: 13px; }
.demo-in { padding-block: 6px; display: flex; gap: 8px; align-items: center; }
.demo b { font-family: var(--font-data); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; border: 1px solid currentColor; padding: 1px 6px; border-radius: 4px; }

main { padding-block: 28px 64px; display: grid; gap: 28px; }

/* ---------- busca ---------- */
.hero { display: grid; gap: 18px; padding-block: 28px 8px; }
.eyebrow { font: 600 12px/1 var(--font-data); letter-spacing: .16em; text-transform: uppercase; color: var(--neon); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(30px, 5.4vw, 52px); font-weight: 700; max-width: 18ch; }
h1 em { font-style: normal; color: var(--neon); text-shadow: 0 0 22px rgba(46,230,255,.45); }
h2 { font-size: 22px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
.lead { color: var(--muted); max-width: 60ch; margin: 0; font-size: 16px; }
.busca { position: relative; max-width: 680px; }
.busca form { display: flex; gap: 8px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 6px; transition: border-color .15s, box-shadow .15s; }
.busca form:focus-within { border-color: var(--neon); box-shadow: 0 0 0 4px var(--neon-dim), 0 0 30px rgba(46,230,255,.15); }
.busca input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; padding: 10px 12px; font-size: 16px; }
.busca input::placeholder { color: var(--muted); }
.btn { border: 0; border-radius: 9px; padding: 10px 18px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; white-space: nowrap; }
.btn-neon { background: var(--neon); color: var(--bg); box-shadow: 0 0 18px rgba(46,230,255,.35); }
.btn-neon:hover { filter: brightness(1.1); }
.btn-linha { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn-linha:hover { border-color: var(--neon); color: var(--neon); }
.btn-peq { padding: 7px 12px; font-size: 13px; }
.sugestoes { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; z-index: 4; box-shadow: 0 20px 40px rgba(0,0,0,.5); }
.sugestoes button { display: flex; width: 100%; justify-content: space-between; gap: 12px; background: none; border: 0; padding: 11px 16px; text-align: left; cursor: pointer; }
.sugestoes button:hover, .sugestoes button.sel { background: var(--panel-2); }
.sugestoes small { color: var(--muted); }
.sugestoes mark { background: none; color: var(--neon); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; cursor: pointer; color: var(--muted); font-size: 14px; }
.chip:hover, .chip.ativo { color: var(--neon); border-color: var(--neon); background: var(--neon-dim); }

/* ---------- diferenciais ---------- */
.trio { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.trio div { border-top: 2px solid var(--neon); padding-top: 12px; display: grid; gap: 4px; }
.trio p { margin: 0; color: var(--muted); font-size: 14px; }

/* ---------- cartões de produto ---------- */
.secao-topo { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.secao-topo p { margin: 4px 0 0; color: var(--muted); }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; grid-template-rows: auto auto 1fr auto; }
.card:hover { border-color: var(--neon); transform: translateY(-2px); }
.card-topo { display: flex; gap: 12px; align-items: center; }
.glifo { width: 48px; height: 48px; flex: none; border-radius: 10px; display: grid; place-items: center; font: 600 12px/1 var(--font-data); letter-spacing: .08em; color: var(--neon); background: var(--neon-dim); border: 1px solid rgba(46,230,255,.3); }
.glifo.grande { width: 84px; height: 84px; font-size: 18px; border-radius: 16px; }
.card-cat { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.card h3 { font-size: 16px; }
.card-preco { display: grid; gap: 2px; align-content: end; }
.card-preco small { color: var(--muted); font-size: 12px; }
.card-preco strong { font: 600 24px/1.1 var(--font-data); color: var(--fg); }
.card-rodape { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }

.selo { display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--font-data); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; white-space: nowrap; }
.selo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
.selo-baixa { color: var(--good); background: var(--good-dim); }
.selo-alta { color: var(--warn); background: var(--warn-dim); }
.selo-normal { color: var(--muted); background: var(--panel-2); }

/* ---------- página do produto ---------- */
.voltar { color: var(--muted); text-decoration: none; font-size: 14px; }
.voltar:hover { color: var(--neon); }
.prod-topo { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
.prod-topo ul { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 14px; }
.prod-topo li::before { content: "▸ "; color: var(--neon); }
.resumo { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
.painel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.melhor { display: grid; gap: 10px; border-color: rgba(92,242,160,.4); box-shadow: inset 0 0 0 1px rgba(92,242,160,.08), 0 0 40px rgba(92,242,160,.06); }
.melhor .rotulo { font: 600 12px/1 var(--font-data); letter-spacing: .14em; text-transform: uppercase; color: var(--good); }
.melhor .valor { font: 600 clamp(32px, 6vw, 44px)/1 var(--font-data); }
.melhor .onde { color: var(--muted); }
.melhor .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.aviso-vitrine { display: grid; gap: 8px; align-content: start; }
.aviso-vitrine .rotulo { font: 600 12px/1 var(--font-data); letter-spacing: .14em; text-transform: uppercase; color: var(--pink); }
.aviso-vitrine p { margin: 0; color: var(--muted); }
.aviso-vitrine strong { color: var(--fg); }

.form-alerta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--panel-2); border: 1px solid var(--neon); border-radius: 10px; padding: 10px 12px; }
.form-alerta label { color: var(--muted); font-size: 14px; }
.campo-preco { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; }
.campo-preco input { width: 110px; background: none; border: 0; outline: none; padding: 8px 6px; font-family: var(--font-data); }

.tabela-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 600 11px/1 var(--font-data); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th.d, td.d { text-align: right; }
tr.primeiro td { background: rgba(92,242,160,.05); }
.loja { display: flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; }
.loja-sigla { width: 30px; height: 30px; flex: none; border-radius: 8px; display: grid; place-items: center; font: 600 11px/1 var(--font-data); background: var(--panel-2); border: 1px solid var(--line); color: var(--fg); }
.tag { font: 600 10px/1 var(--font-data); letter-spacing: .08em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; color: var(--pink); background: rgba(255,92,200,.12); }
.tag.nac { color: var(--muted); background: var(--panel-2); }
.final { font: 600 16px/1.2 var(--font-data); white-space: nowrap; }
tr.primeiro .final { color: var(--good); }
.conta { margin-top: 6px; font: 12px/1.5 var(--font-data); color: var(--muted); }
.conta .imp { color: var(--pink); }
.conta b { color: var(--fg); font-weight: 600; }
.posicao { font: 600 12px/1 var(--font-data); color: var(--muted); }
tr.primeiro .posicao { color: var(--good); }

/* gráfico */
.grafico-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.grafico-topo p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.grafico { width: 100%; height: auto; display: block; }
.grafico text { fill: var(--muted); font: 11px var(--font-data); }
.grafico .grade-l { stroke: var(--line); stroke-width: 1; }
.dica { position: absolute; pointer-events: none; background: var(--panel-2); border: 1px solid var(--neon); border-radius: 8px; padding: 6px 10px; font: 12px/1.4 var(--font-data); white-space: nowrap; transform: translate(-50%, -110%); }
.grafico-caixa { position: relative; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px; }

/* alertas */
.lista-alertas { display: grid; gap: 10px; }
.alerta { display: grid; grid-template-columns: auto 1fr auto auto; gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.alerta.disparou { border-color: var(--good); box-shadow: 0 0 30px rgba(92,242,160,.1); }
.alerta a { color: var(--fg); text-decoration: none; font-weight: 600; }
.alerta a:hover { color: var(--neon); }
.alerta .meta { color: var(--muted); font-size: 13px; }
.alerta .numeros { display: grid; gap: 2px; text-align: right; font-size: 13px; color: var(--muted); }
.alerta .numeros b { color: var(--fg); font: 600 15px var(--font-data); }
.alerta .botoes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.vazio { text-align: center; padding: 48px 16px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); display: grid; gap: 12px; justify-items: center; }

.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: grid; gap: 8px; max-width: min(380px, calc(100vw - 32px)); }
.toast div { background: var(--panel-2); border: 1px solid var(--good); border-radius: 12px; padding: 12px 14px; box-shadow: 0 0 30px rgba(92,242,160,.2); animation: entra .25s ease-out; }
.toast b { color: var(--good); display: block; font-family: var(--font-display); }
@keyframes entra { from { transform: translateY(12px); opacity: 0; } }
.rodape { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 16px; }

@media (max-width: 760px) {
  .resumo { grid-template-columns: 1fr; }
  .topo nav a span.txt { display: none; }
  .prod-topo { grid-template-columns: 1fr; }
  .alerta { grid-template-columns: 1fr; }
  .alerta .numeros { text-align: left; }
  .alerta .botoes { justify-content: flex-start; }
  /* tabela vira cartões */
  table, tbody, tr, td { display: block; }
  thead { display: none; }
  tr { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; padding: 6px 0; }
  td { border: 0; padding: 6px 14px; display: flex; justify-content: space-between; gap: 12px; }
  td.d { text-align: right; }
  td[data-r]::before { content: attr(data-r); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  td.col-final { flex-direction: column; }
  td.col-final::before { display: none; }
  td.col-final .conta { text-align: left; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
