<title>Comparador Placar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout B · Placar ao vivo — painel de aeroporto/bolsa: à esquerda o quadro de partidas
   com todos os produtos (preço em letreiro que vira), à direita o "pregão" do produto
   escolhido: lojas em placas, gráfico de ações com o melhor momento marcado.
   Visual escuro de propósito, sem tema claro. */
:root {
  color-scheme: dark;
  --bg: #0a0b0d;
  --board: #111317;
  --tile: #1a1d22;
  --tile-hi: #23272e;
  --line: #262a31;
  --fg: #eceae4;
  --muted: #7f848d;
  --amber: #ffc94a;           /* letreiro */
  --up: #ff5d5d;              /* subiu (ruim para quem compra) */
  --down: #3ddc84;            /* caiu (bom) */
  --pink: #ff7ac6;            /* imposto */
  --label: "Barlow Condensed", "Arial Narrow", sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
  --body: "Barlow", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); overflow-x: clip; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* topo */
.topo { border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; }
.topo .wrap { display: flex; align-items: center; gap: 18px; padding-block: 10px; }
.logo { font: 700 22px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.logo i { width: 9px; height: 9px; border-radius: 50%; background: var(--down); box-shadow: 0 0 10px var(--down); animation: pisca 2s infinite; }
@keyframes pisca { 50% { opacity: .35; } }
.relogio { font: 500 13px var(--mono); color: var(--muted); }
.busca { margin-left: auto; position: relative; width: min(340px, 40vw); }
.busca input { width: 100%; background: var(--board); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; font: 500 13px var(--mono); text-transform: uppercase; letter-spacing: .04em; outline: none; }
.busca input::placeholder { color: var(--muted); }
.busca input:focus { border-color: var(--amber); }
.bt-alertas { background: var(--board); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; font: 600 14px var(--label); letter-spacing: .1em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
.bt-alertas b { color: var(--bg); background: var(--amber); border-radius: 4px; padding: 0 6px; font-family: var(--mono); font-size: 12px; }
.fita { overflow: hidden; border-bottom: 1px solid var(--line); background: var(--board); white-space: nowrap; }
.fita div { display: inline-flex; gap: 36px; padding: 7px 0; font: 500 12px var(--mono); animation: corre 60s linear infinite; }
.fita span b { color: var(--fg); font-weight: 500; }
.fita .dn { color: var(--down); } .fita .up { color: var(--up); }
.fita .demo { color: var(--amber); }
@keyframes corre { to { transform: translateX(-50%); } }

main { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 20px; padding-block: 20px 40px; align-items: start; }
.painel { background: var(--board); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.painel-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.painel-topo h2 { margin: 0; font: 700 18px/1 var(--label); letter-spacing: .16em; text-transform: uppercase; color: var(--amber); }
.painel-topo span { font: 12px var(--mono); color: var(--muted); }

/* quadro de partidas */
.cab, .row { display: grid; grid-template-columns: 52px minmax(0, 1fr) 96px auto 74px; gap: 12px; align-items: center; }
.cab { padding: 8px 16px; font: 600 12px var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
.cab span:nth-child(4), .cab span:nth-child(5) { text-align: right; }
.row { padding: 8px 16px; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; position: relative; }
.row:hover { background: var(--tile); }
.row.ativo { background: var(--tile-hi); }
.row.ativo::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--amber); }
.row img { width: 52px; height: 40px; object-fit: cover; border-radius: 4px; filter: saturate(.85); }
.prod-nome, .prod-sub { display: block; }
.prod-nome { font: 600 17px/1.1 var(--label); letter-spacing: .03em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prod-sub { font: 12px var(--mono); color: var(--muted); }
.loja-cod { font: 600 13px var(--mono); color: var(--fg); letter-spacing: .06em; }
.loja-cod small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; letter-spacing: 0; }
.var { font: 600 13px var(--mono); text-align: right; white-space: nowrap; }
.var.dn { color: var(--down); } .var.up { color: var(--up); } .var.eq { color: var(--muted); }

/* letreiro que vira */
.flap { display: inline-flex; gap: 2px; justify-content: flex-end; }
.flap span { position: relative; display: inline-grid; place-items: center; width: .78em; height: 1.32em; background: linear-gradient(180deg, #24282f 0 49%, #1c1f25 51% 100%); border-radius: 3px; font: 600 1em/1 var(--mono); color: var(--amber); box-shadow: inset 0 -1px 0 rgba(0,0,0,.6); }
.flap span::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.7); }
.flap span.sep { background: none; width: .42em; box-shadow: none; }
.flap span.sep::after { display: none; }
.flap span.vira { animation: vira .42s cubic-bezier(.3,.7,.4,1) both; }
@keyframes vira { 0% { transform: rotateX(90deg); filter: brightness(1.8); } 100% { transform: rotateX(0); } }
.row .flap { font-size: 15px; }

/* pregão do produto */
.detalhe { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 96px); }
.det-topo { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 16px; padding: 16px; border-bottom: 1px solid var(--line); }
.det-topo img { width: 116px; height: 116px; object-fit: cover; border-radius: 8px; }
.det-topo h1 { margin: 0; font: 700 clamp(24px, 3vw, 34px)/1 var(--label); letter-spacing: .02em; text-transform: uppercase; }
.det-topo .marca { font: 600 12px var(--mono); color: var(--amber); letter-spacing: .14em; text-transform: uppercase; }
.det-preco { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
.det-preco .flap { font-size: 26px; }
.det-meta { font: 12px var(--mono); color: var(--muted); margin-top: 6px; }
.selo { display: inline-block; font: 600 12px var(--label); letter-spacing: .14em; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; border: 1px solid currentColor; }
.selo.baixa { color: var(--down); } .selo.alta { color: var(--up); } .selo.normal { color: var(--muted); }
.botoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.bt { border-radius: 6px; padding: 9px 14px; font: 600 15px var(--label); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; text-decoration: none; border: 1px solid var(--line); background: var(--tile); display: inline-flex; align-items: center; gap: 6px; }
.bt:hover { border-color: var(--amber); color: var(--amber); }
.bt-ouro { background: var(--amber); color: #1a1406; border-color: var(--amber); }
.bt-ouro:hover { color: #1a1406; filter: brightness(1.08); }
.bt-p { padding: 6px 10px; font-size: 13px; }
.form-alerta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; padding: 10px; background: var(--bg); border: 1px dashed var(--amber); border-radius: 6px; }
.form-alerta label { font: 12px var(--mono); color: var(--muted); }
.form-alerta input { width: 120px; background: var(--tile); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: 600 14px var(--mono); color: var(--amber); outline: none; }

.grafico-box { padding: 14px 16px 8px; border-bottom: 1px solid var(--line); }
.grafico-box h3, .lojas h3 { margin: 0 0 8px; font: 600 13px var(--label); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.grafico { width: 100%; height: auto; display: block; }
.grafico text { font: 10.5px var(--mono); fill: var(--muted); }
.lojas { padding: 14px 16px; }
.lj { display: grid; grid-template-columns: 26px 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.lj:last-child { border-bottom: 0; }
.lj .pos { font: 600 12px var(--mono); color: var(--muted); }
.lj.um .pos { color: var(--amber); }
.lj .cod { font: 600 13px var(--mono); letter-spacing: .06em; background: var(--tile); border-radius: 4px; padding: 4px 6px; text-align: center; }
.lj .conta { font: 11.5px/1.45 var(--mono); color: var(--muted); }
.lj .conta .imp { color: var(--pink); }
.lj .conta b { color: var(--fg); font-weight: 500; }
.lj .dir { display: grid; justify-items: end; gap: 4px; }
.lj .flap { font-size: 14px; }
.lj a { font: 600 11px var(--mono); color: var(--muted); text-decoration: none; letter-spacing: .06em; }
.lj a:hover { color: var(--amber); }
.engana { margin: 0 16px 14px; padding: 10px 12px; border: 1px solid rgba(255,122,198,.35); border-radius: 6px; font: 12.5px/1.5 var(--mono); color: #f2c6df; }
.engana b { color: var(--fg); font-weight: 600; }
.nota { font: 11px/1.5 var(--mono); color: var(--muted); padding: 12px 16px; border-top: 1px solid var(--line); }

/* alertas */
.gaveta { position: fixed; inset: auto 0 0 0; z-index: 30; background: var(--board); border-top: 2px solid var(--amber); max-height: 70vh; overflow-y: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -30px 60px rgba(0,0,0,.6); }
.gaveta-in { max-width: 1320px; margin: 0 auto; display: grid; gap: 10px; }
.gaveta header { display: flex; justify-content: space-between; align-items: center; }
.gaveta h2 { margin: 0; font: 700 18px var(--label); letter-spacing: .16em; text-transform: uppercase; color: var(--amber); }
.al { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; background: var(--tile); border-radius: 6px; padding: 8px 12px; }
.al img { width: 52px; height: 40px; object-fit: cover; border-radius: 4px; }
.al .st { font: 600 12px var(--mono); }
.al .st.ok { color: var(--down); }
.al .nums { font: 12px var(--mono); color: var(--muted); }
.al .nums b { color: var(--fg); font-weight: 500; }
.toasts { position: fixed; top: calc(70px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 40; display: grid; gap: 8px; width: min(380px, calc(100vw - 32px)); }
.toasts div { background: var(--amber); color: #1a1406; border-radius: 6px; padding: 10px 14px; font: 600 13px/1.4 var(--mono); box-shadow: 0 16px 40px rgba(0,0,0,.5); animation: vira .4s both; }
.toasts small { display: block; font-weight: 400; }

@media (max-width: 980px) {
  main { grid-template-columns: 1fr; }
  .detalhe { position: static; order: -1; }
}
@media (max-width: 560px) {
  .cab, .row { grid-template-columns: 44px minmax(0, 1fr) auto; }
  .cab span:nth-child(3), .row .loja-cod, .cab span:nth-child(5), .row .var { display: none; }
  .row img { width: 44px; height: 36px; }
  .relogio { display: none; }
  .busca { width: auto; flex: 1; }
  .bt-alertas span { display: none; }
  .det-topo { grid-template-columns: 84px minmax(0, 1fr); }
  .det-topo img { width: 84px; height: 84px; }
  .det-preco .flap { font-size: 21px; }
  .lj { grid-template-columns: 22px minmax(0, 1fr) auto; }
  .lj .cod { grid-column: 2; justify-self: start; }
  .lj .conta { grid-column: 1 / -1; grid-row: 2; }
  .al { grid-template-columns: 44px 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<header class="topo">
  <div class="wrap">
    <div class="logo"><i></i><span id="nome-site">Comparador</span></div>
    <span class="relogio" id="relogio">PREÇOS DE 18/11/2026</span>
    <div class="busca"><input id="campo" type="search" placeholder="Filtrar: airpods, jbl..." autocomplete="off" aria-label="Filtrar produtos"></div>
    <button class="bt-alertas" id="abrir-alertas"><span>Alertas</span><b id="qtd">0</b></button>
  </div>
  <div class="fita" aria-hidden="true"><div id="fita"></div></div>
</header>

<main class="wrap">
  <section class="painel">
    <div class="painel-topo"><h2>Quadro de preços</h2><span id="contagem">menor preço final por produto</span></div>
    <div class="cab"><span></span><span>Produto</span><span>Melhor loja</span><span>Preço final</span><span>7 dias</span></div>
    <div id="quadro"></div>
  </section>
  <section class="painel detalhe" id="detalhe"></section>
</main>

<div class="gaveta" id="gaveta" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="config.js"></script>
<script src="dados/ofertas-exemplo.js"></script>
<script src="nucleo.js"></script>
<script>
(function () {
  const { D, brl, esc, loja, produto, resumo, linkLoja, conta, regra, credito, buscar, alertas, lerValor, dataCurta, meses, nomeCompleto } = N;
  document.getElementById("nome-site").textContent = N.C.nomeDoSite;
  let filtro = "", formAberto = false;
  const atual = () => produto(location.hash.slice(1)) || D.produtos[0];

  // Letreiro: cada caractere vira uma plaquinha; anima as que mudaram.
  const ultimo = {};
  function flap(chave, texto) {
    const antes = ultimo[chave] || ""; ultimo[chave] = texto;
    return `<span class="flap" aria-label="${esc(texto)}">${[...texto].map((c, i) => {
      const sep = c === " " || c === "." || c === ",";
      const mudou = antes[i] !== c ? " vira" : "";
      return `<span class="${sep ? "sep" : ""}${mudou}" style="animation-delay:${i * 35}ms">${esc(c)}</span>`;
    }).join("")}</span>`;
  }
  const valorFlap = v => brl(v).replace("R$", "").replace(/ /g, "").trim();
  const seta = v => v.pct < -0.004 ? `<span class="var dn">▼ ${Math.abs(v.pct * 100).toFixed(1)}%</span>` : v.pct > 0.004 ? `<span class="var up">▲ ${(v.pct * 100).toFixed(1)}%</span>` : `<span class="var eq">= 0,0%</span>`;
  const contaHTML = o => esc(conta(o)).replace(/(\+ imposto [^+]+\+ ICMS [^=]+)/, '<span class="imp">$1</span>').replace(/= (R\$[^n]+)na sua casa/, "= <b>$1</b>na sua casa");

  function fita() {
    const itens = D.produtos.map(p => { const r = resumo(p), v = r.variacao; return `<span><b>${esc(nomeCompleto(p).toUpperCase())}</b> ${brl(r.melhor.total)} <span class="${v.pct < 0 ? "dn" : "up"}">${v.pct < 0 ? "▼" : "▲"}${Math.abs(v.pct * 100).toFixed(1)}%</span></span>`; }).join("");
    const html = `<span class="demo">PREÇOS DE DEMONSTRAÇÃO · PRODUTOS REAIS, VALORES INVENTADOS</span>${itens}`;
    document.getElementById("fita").innerHTML = html + html;
  }

  function quadro() {
    const lista = buscar(filtro), at = atual();
    document.getElementById("contagem").textContent = `${lista.length} produtos · menor preço final`;
    document.getElementById("quadro").innerHTML = lista.length ? lista.map(p => {
      const r = resumo(p), m = r.melhor;
      return `<button class="row ${p.id === at.id ? "ativo" : ""}" data-id="${p.id}">
        <img src="${p.foto}" alt="">
        <span style="min-width:0"><span class="prod-nome">${esc(nomeCompleto(p))}</span><span class="prod-sub">${esc(p.categoria)} · ${r.lista.length} lojas</span></span>
        <span class="loja-cod">${loja(m.loja).sigla}<small>${m.prazoDias} dias</small></span>
        ${flap("q-" + p.id, valorFlap(m.total))}
        ${seta(r.variacao)}
      </button>`;
    }).join("") : `<p style="padding:20px 16px;font:13px var(--mono);color:var(--muted)">NENHUM PRODUTO COM ESSE NOME NA DEMONSTRAÇÃO.</p>`;
  }

  function detalhe() {
    const p = atual(), r = resumo(p), m = r.melhor, alerta = alertas.de(p.id);
    document.getElementById("detalhe").innerHTML = `
      <div class="painel-topo"><h2>Pregão</h2><span>${r.lista.length} lojas · atualizado ${N.dataBR(D.atualizadoEm)}</span></div>
      <div class="det-topo">
        <img src="${p.foto}" alt="${esc(nomeCompleto(p))}">
        <div style="min-width:0">
          <div class="marca">${esc(p.marca)} · ${esc(p.categoria)}</div>
          <h1>${esc(p.nome)}</h1>
          <div class="det-preco">${flap("d-total", valorFlap(m.total))} ${seta(r.variacao)}</div>
          <div class="det-meta">MELHOR FINAL NA ${esc(loja(m.loja).nome.toUpperCase())} · CHEGA EM ${m.prazoDias} DIAS</div>
          <div style="margin-top:8px"><span class="selo ${r.selo.tipo}">${r.selo.texto}</span></div>
          <div class="botoes">
            <a class="bt bt-ouro" href="${linkLoja(m, p)}" target="_blank" rel="noopener">Ir para a ${esc(loja(m.loja).nome)} ↗</a>
            <button class="bt" id="bt-alerta">${alerta ? "Alerta " + brl(alerta.alvo) : "Me avise quando baixar"}</button>
          </div>
          <form class="form-alerta" id="form-alerta" ${formAberto ? "" : "hidden"}>
            <label for="alvo">AVISAR EM</label>
            <input id="alvo" inputmode="decimal" value="${(alerta ? alerta.alvo : Math.floor(m.total * 0.9)).toFixed(2).replace(".", ",")}">
            <button class="bt bt-ouro bt-p" type="submit">${alerta ? "Atualizar" : "Criar"}</button>
            ${alerta ? '<button class="bt bt-p" type="button" id="bt-remover">Remover</button>' : ""}
          </form>
        </div>
      </div>
      <div class="grafico-box"><h3><span>26 semanas · ${esc(loja(m.loja).nome)}</span><span style="color:var(--down)">● melhor momento</span></h3>${grafico(m)}</div>
      ${r.vitrineEngana ? `<div class="engana" style="margin-top:14px">VITRINE ENGANA: na <b>${esc(loja(r.porVitrine.loja).nome)}</b> o anúncio diz <b>${brl(r.porVitrine.preco)}</b>, mas com frete e impostos sai <b>${brl(r.porVitrine.total)}</b> (${r.posVitrine}º lugar).</div>` : ""}
      <div class="lojas"><h3><span>Lojas por preço final</span><span>conta aberta</span></h3>
        ${r.lista.map((o, i) => `<div class="lj ${i === 0 ? "um" : ""}">
          <span class="pos">${String(i + 1).padStart(2, "0")}</span>
          <span class="cod">${loja(o.loja).sigla}</span>
          <span class="conta">${esc(loja(o.loja).nome)}${o.internacional ? " · importado" : ""} · ${o.prazoDias} dias<br>${contaHTML(o)}</span>
          <span class="dir">${flap("l-" + i, valorFlap(o.total))}<a href="${linkLoja(o, p)}" target="_blank" rel="noopener">LOJA ↗</a></span>
        </div>`).join("")}
      </div>
      <div class="nota">${esc(regra())}<br>${esc(credito(p))}.</div>`;
  }

  // Gráfico de ações: candles semanais (abertura = semana anterior), linha da média, melhor momento.
  function grafico(o) {
    const estreito = window.innerWidth < 700;
    const W = estreito ? 520 : 640, H = 230, pl = 58, pr = 12, pt = 18, pb = 24;
    const h = o.historico, n = h.length, vals = h.map(x => x.preco);
    let min = Math.min(...vals), max = Math.max(...vals); const pad = (max - min) * .12 || max * .05; min -= pad; max += pad;
    const x = i => pl + (i + .5) / n * (W - pl - pr), y = v => pt + (1 - (v - min) / (max - min)) * (H - pt - pb);
    const larg = (W - pl - pr) / n * .56;
    const mm = N.melhorMomento(o);
    let g = "";
    [0, .5, 1].forEach(t => { const v = min + pad + t * (max - min - 2 * pad); g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#262a31" stroke-dasharray="2 4"/><text x="${pl - 8}" y="${y(v) + 3}" text-anchor="end">${N.brlCurto(v)}</text>`; });
    let ult = -1;
    h.forEach((p, i) => {
      const ab = i ? h[i - 1].preco : p.preco, fe = p.preco, cai = fe <= ab;
      const cor = cai ? "#3ddc84" : "#ff5d5d";
      const topo = y(Math.max(ab, fe)), base = y(Math.min(ab, fe));
      const pavio = Math.abs(fe - ab) * .35 + (max - min) * .01;
      g += `<line x1="${x(i)}" x2="${x(i)}" y1="${y(Math.max(ab, fe) + pavio)}" y2="${y(Math.min(ab, fe) - pavio)}" stroke="${cor}" stroke-width="1"/>`;
      g += `<rect x="${x(i) - larg / 2}" y="${topo}" width="${larg}" height="${Math.max(1.5, base - topo)}" fill="${cor}" rx="1"/>`;
      const k = +p.data.slice(5, 7) - 1; if (k !== ult && i) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${meses[k]}</text>`; ult = k;
    });
    const media = vals.slice(-13).reduce((a, b) => a + b, 0) / 13;
    g += `<line x1="${x(n - 13)}" x2="${x(n - 1)}" y1="${y(media)}" y2="${y(media)}" stroke="#ffc94a" stroke-width="1" stroke-dasharray="5 3"/><text x="${x(n - 13) - 6}" y="${y(media) + 3}" text-anchor="end" style="fill:#ffc94a;paint-order:stroke;stroke:#111317;stroke-width:4px">média 90 d</text>`;
    const tx = Math.min(Math.max(x(mm.indice), pl + 70), W - pr - 70);
    g += `<circle cx="${x(mm.indice)}" cy="${y(mm.preco)}" r="7" fill="none" stroke="#3ddc84" stroke-width="1.5"/><text x="${tx}" y="${Math.min(y(mm.preco) + 20, H - pb - 4)}" text-anchor="middle" style="fill:#3ddc84;paint-order:stroke;stroke:#111317;stroke-width:4px">${brl(mm.preco)} · ${dataCurta(mm.data)}</text>`;
    return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Histórico de preço em velas semanais">${g}</svg>`;
  }

  // ---------- alertas ----------
  const $g = document.getElementById("gaveta");
  function toast(t, s) { const el = document.createElement("div"); el.innerHTML = `${t}${s ? `<small>${s}</small>` : ""}`; document.getElementById("toasts").appendChild(el); setTimeout(() => el.remove(), 6000); }
  function gaveta() {
    const l = alertas.lista();
    $g.innerHTML = `<div class="gaveta-in"><header><h2>Meus alertas</h2><button class="bt bt-p" id="fechar">Fechar</button></header>
      <p style="margin:0;font:12px var(--mono);color:var(--muted)">GUARDADOS NESTE NAVEGADOR. “SIMULAR QUEDA” MOSTRA COMO CHEGA O AVISO.</p>
      ${l.length ? l.map(a => { const p = produto(a.produtoId); if (!p) return ""; const m = resumo(p).melhor, ok = m.total <= a.alvo;
        return `<div class="al"><img src="${p.foto}" alt=""><div><div class="prod-nome" style="font-size:15px">${esc(nomeCompleto(p))}</div><div class="nums">AGORA <b>${brl(m.total)}</b> · ALVO <b>${brl(a.alvo)}</b> · <span class="st ${ok ? "ok" : ""}">${ok ? "BAIXOU" : "AGUARDANDO"}</span></div></div>
          ${alertas.simulado(p.id) ? `<button class="bt bt-p" data-desfazer="${p.id}">Desfazer</button>` : `<button class="bt bt-p" data-simular="${p.id}">Simular queda</button>`}<button class="bt bt-p" data-remover="${p.id}">Remover</button></div>`; }).join("")
      : `<p style="font:13px var(--mono);color:var(--muted)">NENHUM ALERTA. ESCOLHA UM PRODUTO E TOQUE EM “ME AVISE QUANDO BAIXAR”.</p>`}</div>`;
  }
  function tudo() {
    quadro(); detalhe(); fita();
    document.getElementById("qtd").textContent = alertas.lista().length;
    alertas.novosDisparos().forEach(d => toast(`BAIXOU: ${esc(nomeCompleto(d.produto).toUpperCase())} ${brl(d.melhor.total)}`, `na ${esc(loja(d.melhor.loja).nome)} · alvo ${brl(d.alerta.alvo)}`));
    if (!$g.hidden) gaveta();
  }
  document.getElementById("abrir-alertas").onclick = () => { $g.hidden = !$g.hidden; if (!$g.hidden) gaveta(); };
  $g.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "fechar") $g.hidden = true;
    else if (b.dataset.simular) { alertas.simular(b.dataset.simular); location.hash = b.dataset.simular; tudo(); }
    else if (b.dataset.desfazer) { alertas.desfazer(b.dataset.desfazer); tudo(); }
    else if (b.dataset.remover) { alertas.remover(b.dataset.remover); tudo(); }
  });
  document.getElementById("quadro").addEventListener("click", e => { const b = e.target.closest(".row"); if (b) location.hash = b.dataset.id; });
  const $d = document.getElementById("detalhe");
  $d.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "bt-alerta") { formAberto = !formAberto; document.getElementById("form-alerta").hidden = !formAberto; if (formAberto) document.getElementById("alvo").focus(); }
    if (b.id === "bt-remover") { alertas.remover(atual().id); formAberto = false; toast("ALERTA REMOVIDO"); tudo(); }
  });
  $d.addEventListener("submit", e => {
    e.preventDefault();
    const v = lerValor(document.getElementById("alvo").value);
    if (!(v > 0)) { toast("DIGITE UM PREÇO", "ex.: 199,90"); return; }
    alertas.salvar(atual().id, v); formAberto = false; toast("ALERTA CRIADO", `aviso aqui na tela quando chegar a ${brl(v)}`); tudo();
  });
  document.getElementById("campo").addEventListener("input", e => { filtro = e.target.value; quadro(); });
  window.addEventListener("hashchange", () => { formAberto = false; tudo(); if (window.innerWidth < 980) window.scrollTo({ top: 0, behavior: "smooth" }); });
  tudo();
})();
</script>
